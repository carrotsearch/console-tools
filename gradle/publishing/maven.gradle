// Publishing to Maven Central (via Sonatype's Central Portal): a bundle upload
// for releases, the snapshot repository for snapshots.
//
//   ./gradlew publishToMavenCentral
//
// The plugin itself (MavenCentralPublishingPlugin from buildinfra) is applied in the root
// build script: buildinfra classes are not visible from script plugins.
//
// 'publishLocal' and 'prepareMavenCentralBundle' can be used to inspect
// what would be published (build/maven, build/maven-bundle).

configure(rootProject) {
  mavenCentralPublishing {
    // Do not generate or publish gradle metadata files.
    gradleModuleMetadata = false

    pom {
      url = 'https://github.com/carrotsearch/console-tools'
      inceptionYear = "2019"

      licenses {
        license {
          name = 'BSD License'
          url = 'https://github.com/carrotsearch/console-tools/blob/master/LICENSE.txt'
        }
      }

      organization {
        name = "Carrot Search s.c."
        url = "https://www.carrotsearch.com"
      }

      developers {
        developer {
          id = 'stanislaw.osinski'
          name = 'Stanisław Osiński'
          email = 'stanislaw.osinski@carrotsearch.com'
        }
        developer {
          id = 'dawid.weiss'
          name = 'Dawid Weiss'
          email = 'dawid.weiss@carrotsearch.com'
        }
      }

      scm {
        connection = 'scm:git:git@github.com:carrotsearch/console-tools.git'
        developerConnection = 'scm:git:git@github.com:carrotsearch/console-tools.git'
        url = 'https://github.com/carrotsearch/console-tools'
      }
    }

    [
      ":formatters",
      ":launcher",
      ":testing"
    ].each { path ->
      project(path) {
        pom {
          // Maven Central requires a description; same as the project's name.
          description = rootProject.project(path).name
        }
      }
    }
  }
}
